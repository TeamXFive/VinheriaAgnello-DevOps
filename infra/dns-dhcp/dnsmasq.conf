# Servidor DHCP e DNS da rede da Vinheria Agnello (10.20.0.0/24)

# ---------- DNS ----------
domain=vinheria.local
local=/vinheria.local/
expand-hosts
# Nomes fixos da infraestrutura
host-record=dns-dhcp.vinheria.local,10.20.0.2
host-record=jenkins.vinheria.local,10.20.0.3
# Nomes fora da rede interna seguem para um DNS público
no-resolv
server=1.1.1.1
log-queries

# ---------- DHCP ----------
dhcp-authoritative
dhcp-range=10.20.0.100,10.20.0.150,255.255.255.0,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.2
dhcp-option=option:domain-name,vinheria.local
# Reservas: os microsserviços recebem sempre o mesmo endereço (MAC, nome, IP)
dhcp-host=02:42:0a:14:00:65,pedidos,10.20.0.101
dhcp-host=02:42:0a:14:00:66,estoque,10.20.0.102
log-dhcp
# Cada cliente DHCP é registrado no DNS como <nome-do-host>.vinheria.local
